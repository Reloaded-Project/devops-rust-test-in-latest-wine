name: Test Wine Action

on:
  pull_request:
    branches:
      - v1-master
    paths:
      - "action.yml"
      - ".github/workflows/test-workflow.yml"
      - "test-project/**"
  schedule:
    - cron: "0 9 * * 1" # Weekly on Mondays at 09:00 UTC
  workflow_dispatch:

jobs:
  test-wine-gnu-targets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-gnu
          - i686-pc-windows-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          rust-project-path: "test-project"
          rust-toolchain: stable
          target: ${{ matrix.target }}
          additional-test-args: "-- --show-output"

  test-xwin-msvc-targets:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-msvc
          - i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          rust-project-path: "test-project"
          rust-toolchain: stable
          target: ${{ matrix.target }}
          use-xwin: true
          additional-test-args: "-- --show-output"

  test-nightly-toolchain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          rust-project-path: "test-project"
          rust-toolchain: nightly
          target: "x86_64-pc-windows-gnu"
          additional-test-args: "-- --show-output"

  test-wine-devel-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          rust-project-path: "test-project"
          rust-toolchain: stable
          target: x86_64-pc-windows-gnu
          wine-version: devel
          additional-test-args: "-- --show-output"
